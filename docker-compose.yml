version: '3.8'

services:
  # ==========================================
  # 1. Backend REST API Service
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: edusathi-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost
      - JWT_SECRET=${JWT_SECRET:-edusathi_production_super_secret_jwt_key_2026}
      - DATABASE_URL=${DATABASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
    volumes:
      - server-data:/app/data
    networks:
      - edusathi-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # 2. Frontend React Client (Nginx High-Speed Proxy)
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: edusathi-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - edusathi-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ==========================================
  # 3. Optional PostgreSQL Service (Self-Hosted)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: edusathi-postgres
    restart: unless-stopped
    profiles: ["postgres", "full"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=edusathi
      - POSTGRES_USER=edusathi
      - POSTGRES_PASSWORD=edusathi_secure_db_password_123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed/001_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - edusathi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusathi -d edusathi"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edusathi-net:
    driver: bridge

volumes:
  server-data:
    driver: local
  postgres-data:
    driver: local
