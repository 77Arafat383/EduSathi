services:
  # ==========================================
  # 1. Backend REST API Service
  # ==========================================
  server:
    image: edusathi-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
      network: host
    container_name: edusathi-server
    restart: unless-stopped
    ports:
      - "${PORT_SERVER:-5000}:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - JWT_SECRET=${JWT_SECRET:-edusathi_production_super_secret_jwt_key_2026}
      - DATABASE_URL=${DATABASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - Groq_API=${Groq_API:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OpenAI_API=${OpenAI_API:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_MODEL=${AI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - server-data:/app/data
    networks:
      - edusathi-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # 2. Frontend React Client (Nginx High-Speed Proxy)
  # ==========================================
  client:
    image: edusathi-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
      network: host
    container_name: edusathi-client
    restart: unless-stopped
    ports:
      - "${PORT_CLIENT:-80}:80"
      - "${PORT_ALT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - edusathi-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ==========================================
  # 3. Optional PostgreSQL Service (Self-Hosted)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: edusathi-postgres
    restart: unless-stopped
    profiles: ["postgres", "full"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=edusathi
      - POSTGRES_USER=edusathi
      - POSTGRES_PASSWORD=edusathi_secure_db_password_123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed/001_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - edusathi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusathi -d edusathi"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edusathi-net:
    driver: bridge

volumes:
  server-data:
    driver: local
  postgres-data:
    driver: local
